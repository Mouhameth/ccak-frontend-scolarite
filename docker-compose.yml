services:
  app:
    container_name: ccak-frontend-app
    build:
      context: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - PORT=3000
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped

  dev:
    container_name: ccak-frontend-dev
    image: node:20-alpine
    working_dir: /app
    command: >
      sh -c "corepack prepare pnpm@10.17.1 --activate &&
             corepack pnpm install --frozen-lockfile &&
             corepack pnpm dev --hostname 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    env_file:
      - .env.local
    environment:
      - PORT=5173
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - .:/app
      - pnpm-store:/root/.local/share/pnpm/store
      - node_modules:/app/node_modules
    tty: true
    stdin_open: true
    restart: unless-stopped

volumes:
  pnpm-store:
  node_modules:
